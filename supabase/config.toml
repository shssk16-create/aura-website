# Supabase project configuration for Aura AI Studio.
#
# This file is committed so local CLI runs (`supabase start`, `supabase db
# diff`, etc.) work out of the box. The production project must live in a
# KSA region — see docs/COMPLIANCE.md.

project_id = "aura-ai-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.buckets.products]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[storage.buckets.generated]
public = false
file_size_limit = "20MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.generation-worker]
verify_jwt = false
